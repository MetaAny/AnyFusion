version: 1
executor:
  command: codex
  timeout: 900
  max_duration: 3600
orchestration:
  reminder_enabled: false
  reminder_throttle: 300
  top_k_preferences: 5
  blocked_recheck_enabled: true
  blocked_recheck_interval: 60
  max_concurrent_attempts: 4
ui:
  language: zh-CN
  dashboard_on_start: false
integrations:
  markdown_preview:
    enabled: false
notifications:
  feishu:
    enabled: false
gateway:
  enabled: true
  platforms:
    feishu:
      enabled: true
      domain: feishu
      connection_mode: websocket
      app_secret_env: FEISHU_APP_SECRET
      access:
        dm_policy: pairing
        allowed_users: []
        group_policy: open
        require_mention: true
      delivery:
        final_markdown_mode: card
        fallback_mode: post
        final_file_fallback: true
        publication_approval: auto
